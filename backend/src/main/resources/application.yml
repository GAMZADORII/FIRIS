server:
  port: 8080
spring:
  application:
    name: firis-backend
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:h2:mem:firis;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:FIRIS-local-development-secret-key-2026-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

app:
  worker:
    default-password: ${WORKER_DEFAULT_PASSWORD:qwe123}
