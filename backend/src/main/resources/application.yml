server:
  port: 8080
spring:
  application:
    name: firis-backend
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/firis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  sql:
    init:
      mode: never
security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

app:
  event:
    storage-directory: ${EVENT_STORAGE_DIR:../storage/events}
  camera:
    base-url: ${CAMERA_BASE_URL:http://localhost:8080}
    video-directory: ${CAMERA_VIDEO_DIRECTORY:../storage/videos}
  admin:
    login-id: ${ADMIN_LOGIN_ID:admin}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:관리자}
  worker:
    default-password: ${WORKER_DEFAULT_PASSWORD:}
