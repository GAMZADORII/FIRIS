services:
  mysql:
    image: mysql:8.4.11
    container_name: firis-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: firis
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - firis-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: firis-backend:local
    container_name: firis-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/firis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_API_KEY: ${AI_API_KEY}
      AI_SERVER_URL: http://ai:8000
      CAMERA_VIDEO_DIRECTORY: /app/storage/videos
      EVENT_STORAGE_DIR: /app/storage/events
    volumes:
      - ./storage/videos:/app/storage/videos:ro
      - ./storage/events:/app/storage/events:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    image: firis-ai:local
    container_name: firis-ai
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080
      AI_API_KEY: ${AI_API_KEY}
      AI_MODELS_DIR: /app/model
      EVENT_STORAGE_DIR: /app/storage/events
      LIVE_FRAME_DIR: /app/storage/live
      VIDEO_STORAGE_DIR: /app/storage/videos
    volumes:
      - ./ai/model:/app/model:ro
      - ./storage/videos:/app/storage/videos:ro
      - ./storage/events:/app/storage/events
      - ./storage/live:/app/storage/live
    restart: unless-stopped

  ai-worker:
    build:
      context: ./ai
    image: firis-ai:local
    command: ["python", "-m", "app.services.multi_camera_service", "--model", "yolo", "--sample-fps", "3", "--loop"]
    environment:
      BACKEND_URL: http://backend:8080
      AI_API_KEY: ${AI_API_KEY}
      AI_MODELS_DIR: /app/model
      EVENT_STORAGE_DIR: /app/storage/events
      LIVE_FRAME_DIR: /app/storage/live
      VIDEO_STORAGE_DIR: /app/storage/videos
    volumes:
      - ./ai/model:/app/model:ro
      - ./storage/videos:/app/storage/videos:ro
      - ./storage/events:/app/storage/events
      - ./storage/live:/app/storage/live
    depends_on:
      - backend
      - ai
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    image: firis-frontend:local
    container_name: firis-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped

volumes:
  firis-mysql-data:
