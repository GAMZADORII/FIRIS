services:
  mysql:
    image: mysql:8.4.11
    container_name: firis-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: firis
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - firis-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: firis-backend:local
    container_name: firis-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/firis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-김진우}
      WORKER_DEFAULT_PASSWORD: ${WORKER_DEFAULT_PASSWORD:-}
      AI_API_KEY: ${AI_API_KEY}
      CONTACT_CONSENT_VERSION: ${CONTACT_CONSENT_VERSION:-v1}
      CONTACT_ONBOARDING_ENFORCED: ${CONTACT_ONBOARDING_ENFORCED:-false}
      MOCK_119_DELIVERY_MODE: ${MOCK_119_DELIVERY_MODE:-integrated}
      MOCK_119_CENTER_ENABLED: ${MOCK_119_CENTER_ENABLED:-true}
      MOCK_119_ALLOWED_ORIGINS: ${MOCK_119_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      MOCK_119_WS_URL: ${MOCK_119_WS_URL:-}
      MOCK_119_API_KEY: ${MOCK_119_API_KEY:-}
      MOCK_119_SITE_ADDRESS: ${MOCK_119_SITE_ADDRESS:-}
      MOCK_119_CONTROL_ROOM_PHONE: ${MOCK_119_CONTROL_ROOM_PHONE:-}
      AI_SERVER_URL: http://ai:8000
      CAMERA_VIDEO_DIRECTORY: /app/storage/videos
      EVENT_STORAGE_DIR: /app/storage/events
    volumes:
      - ./storage/videos:/app/storage/videos:ro
      - ./storage/events:/app/storage/events:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    image: firis-ai:local
    container_name: firis-ai
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080
      AI_API_KEY: ${AI_API_KEY}
      AI_MODELS_DIR: /app/model
      EVENT_STORAGE_DIR: /app/storage/events
      LIVE_FRAME_DIR: /app/storage/live
      VIDEO_STORAGE_DIR: /app/storage/videos
    volumes:
      - ./ai/model:/app/model:ro
      - ./storage/videos:/app/storage/videos:ro
      - ./storage/events:/app/storage/events
      - ./storage/live:/app/storage/live
    restart: unless-stopped

  ai-worker:
    build:
      context: ./ai
    image: firis-ai:local
    command: ["python", "-m", "app.services.multi_camera_service", "--model", "yolo", "--sample-fps", "1", "--loop"]
    environment:
      BACKEND_URL: http://backend:8080
      AI_API_KEY: ${AI_API_KEY}
      AI_MODELS_DIR: /app/model
      EVENT_STORAGE_DIR: /app/storage/events
      LIVE_FRAME_DIR: /app/storage/live
      VIDEO_STORAGE_DIR: /app/storage/videos
    volumes:
      - ./ai/model:/app/model:ro
      - ./storage/videos:/app/storage/videos:ro
      - ./storage/events:/app/storage/events
      - ./storage/live:/app/storage/live
    depends_on:
      - backend
      - ai
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    image: firis-frontend:local
    container_name: firis-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped

  119-center-frontend:
    build:
      context: ./119-center-frontend
    image: firis-119-center-frontend:local
    container_name: firis-119-center-frontend
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  firis-mysql-data:
